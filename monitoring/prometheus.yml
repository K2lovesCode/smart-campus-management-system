global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: 'smart-campus-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:5000']
        labels:
          service: smart-campus-api

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
