apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: smart-campus
data:
  NODE_ENV: "production"
  PORT: "5000"
  MONGO_URI: "mongodb://mongo:27017/smart_campus"
  JWT_EXPIRES_IN: "1d"
  ATTENDANCE_THRESHOLD: "75"
  CLIENT_ORIGIN: "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: smart-campus
type: Opaque
stringData:
  # In production, replace this with a sealed secret or an external secret manager.
  JWT_SECRET: "replace_me_with_a_long_random_secret"
